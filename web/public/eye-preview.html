<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLUE 헤더 눈 — 확대 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 1.25rem; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1rem; font-size: 0.875rem; color: #475569; }
    .row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-end; margin-bottom: 1.5rem; }
    .header-mock {
      display: flex; align-items: center; gap: 4px; padding: 10px 12px; margin-bottom: 1rem;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    }
    .header-mock-label { font-size: 17px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: #2563eb; font-family: system-ui, sans-serif; }
    .demo { display: flex; flex-direction: column; align-items: flex-start; gap: 0.35rem; }
    .demo span { font-size: 11px; color: #64748b; }
    .chip {
      display: grid; place-items: center;
      background: #2563eb;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgb(37 99 235 / 0.35);
    }
    svg.vlue-eye { display: block; transform: translateY(-1px); }
  </style>
</head>
<body>
  <h1>VLUE 홈 버튼 눈 마크 확대 확인</h1>
  <p>개발 서버 실행 후 브라우저에서 아래 주소로 엽니다.</p>

  <div class="header-mock">
    <div class="chip" style="width:32px;height:24px;flex-shrink:0;overflow:visible;display:grid;place-items:center">
      <svg class="vlue-eye" xmlns="http://www.w3.org/2000/svg" width="32" height="30" viewBox="0 0.625 24 24" fill="none" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <clipPath id="p28" clipPathUnits="userSpaceOnUse">
              <ellipse cx="12" cy="15.05" rx="9.75" ry="6.9" />
            </clipPath>
          </defs>
          <circle cx="12" cy="15.05" r="4" fill="white" clip-path="url(#p28)" />
          <g stroke="white" stroke-linecap="round" fill="none">
            <path d="M8.05 13.92 Q12 16.52 15.95 13.92" stroke-width="0.34" stroke-linecap="butt" stroke-linejoin="round" />
            <line stroke-width="0.36" x1="7.95" y1="14.35" x2="7.6" y2="15.75" />
            <line stroke-width="0.36" x1="9.95" y1="14.92" x2="9.7" y2="16.2" />
            <line stroke-width="0.36" x1="12" y1="15.05" x2="12" y2="16.45" />
            <line stroke-width="0.36" x1="14.05" y1="14.92" x2="14.3" y2="16.2" />
            <line stroke-width="0.36" x1="16.05" y1="14.35" x2="16.4" y2="15.75" />
          </g>
          <path d="M4.2 13.8 Q12 6.2 19.8 13.8" stroke="white" stroke-width="1.45" stroke-linecap="butt" stroke-linejoin="round" fill="none" />
        </svg>
    </div>
    <span class="header-mock-label">VLUE</span>
  </div>

  <div class="row">
    <div class="demo">
      <span>헤더 외 확대 96×96 / 파랑 96×96</span>
      <div class="chip" style="width:96px;height:96px;border-radius:14px;">
        <svg class="vlue-eye" xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0.625 24 24" fill="none" aria-hidden="true">
          <defs>
            <clipPath id="p96" clipPathUnits="userSpaceOnUse">
              <ellipse cx="12" cy="15.05" rx="9.75" ry="6.9" />
            </clipPath>
          </defs>
          <circle cx="12" cy="15.05" r="4" fill="white" clip-path="url(#p96)" />
          <g stroke="white" stroke-linecap="round" fill="none">
            <path d="M8.05 13.92 Q12 16.52 15.95 13.92" stroke-width="0.34" stroke-linecap="butt" stroke-linejoin="round" />
            <line stroke-width="0.36" x1="7.95" y1="14.35" x2="7.6" y2="15.75" />
            <line stroke-width="0.36" x1="9.95" y1="14.92" x2="9.7" y2="16.2" />
            <line stroke-width="0.36" x1="12" y1="15.05" x2="12" y2="16.45" />
            <line stroke-width="0.36" x1="14.05" y1="14.92" x2="14.3" y2="16.2" />
            <line stroke-width="0.36" x1="16.05" y1="14.35" x2="16.4" y2="15.75" />
          </g>
          <path d="M4.2 13.8 Q12 6.2 19.8 13.8" stroke="white" stroke-width="1.45" stroke-linecap="butt" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
    </div>

    <div class="demo">
      <span>확대 192×192 / 파랑 192×192</span>
      <div class="chip" style="width:192px;height:192px;border-radius:28px;">
        <svg class="vlue-eye" xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0.625 24 24" fill="none" aria-hidden="true">
          <defs>
            <clipPath id="p192" clipPathUnits="userSpaceOnUse">
              <ellipse cx="12" cy="15.05" rx="9.75" ry="6.9" />
            </clipPath>
          </defs>
          <circle cx="12" cy="15.05" r="4" fill="white" clip-path="url(#p192)" />
          <g stroke="white" stroke-linecap="round" fill="none">
            <path d="M8.05 13.92 Q12 16.52 15.95 13.92" stroke-width="0.34" stroke-linecap="butt" stroke-linejoin="round" />
            <line stroke-width="0.36" x1="7.95" y1="14.35" x2="7.6" y2="15.75" />
            <line stroke-width="0.36" x1="9.95" y1="14.92" x2="9.7" y2="16.2" />
            <line stroke-width="0.36" x1="12" y1="15.05" x2="12" y2="16.45" />
            <line stroke-width="0.36" x1="14.05" y1="14.92" x2="14.3" y2="16.2" />
            <line stroke-width="0.36" x1="16.05" y1="14.35" x2="16.4" y2="15.75" />
          </g>
          <path d="M4.2 13.8 Q12 6.2 19.8 13.8" stroke="white" stroke-width="1.45" stroke-linecap="butt" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
    </div>
  </div>

  <p style="margin-top:0.5rem">
    같은 도형 비율의 정적 블루 카드 에셋:
    <a href="/vlue-shield-eye-logo-preview.svg"><code>/vlue-shield-eye-logo-preview.svg</code></a>
  </p>
</body>
</html>
