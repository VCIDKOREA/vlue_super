# Railway — @vlue/web (모노레포 루트에서 배포)
# Settings → Deploy → Start Command 가 비어 있으면 이 파일 설정을 따릅니다.

[build]
builder = "nixpacks"
# npm ci / rm .vite 금지 — Railway 설치 단계와 충돌(EBUSY) 남
# NODE_ENV=production 이면 vite·typescript(devDeps) 미설치 → 빌드 실패 방지
buildCommand = "npm run build -w @vlue/shared && node scripts/sync-pc-installer-to-web.mjs && npm run build -w @vlue/web"

[build.env]
NIXPACKS_NODE_INSTALL_DEV_DEPS = "true"
NPM_CONFIG_PRODUCTION = "false"
# Railway 빌드 시 설치 파일 필수 — 대시보드에 VLUE_PC_INSTALLER_URL(공개 .exe URL) 설정
REQUIRE_PC_INSTALLER = "1"

[deploy]
startCommand = "npm run start -w @vlue/web"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
