# fly.toml app configuration file for vlue-api (Fly.io Tokyo nrt - closest to Korea)

app = "vlue-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy --schema packages/db/prisma/schema.prisma"

  [env]
  PORT = "8788"
  NODE_ENV = "production"
  APP_BASE_URL = "https://api.vlue.kr"
  FRONTEND_URL = "https://www.vlue.kr"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "20s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
