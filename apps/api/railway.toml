# Railway — @vlue/api (모노레포 루트에서 배포할 때)
# 서비스 Root Directory: 저장소 루트(/) 권장

[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build -w @vlue/db && npm run build -w @vlue/shared && npm run build -w @vlue/api"

[deploy]
startCommand = "npm run start -w @vlue/api"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
