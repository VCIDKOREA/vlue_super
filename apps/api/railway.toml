# Railway — @vlue/api (모노레포 루트에서 배포할 때)
# Root Directory: 저장소 루트 (/)
#
# 필수: Variables 탭에 DATABASE_URL, REDIS_URL, GEMINI_API_KEY,
#   PORTONE_API_SECRET, PORTONE_V2_API_SECRET, JWT_ACCESS_SECRET, SESSION_SECRET, FILE_STORAGE_PROVIDER
#   → docs/RAILWAY_API_ENV.md 참고

[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build -w @vlue/db && npm run build -w @vlue/shared && npm run build -w @vlue/api"
nixpacksConfigPath = "apps/api/nixpacks.toml"

[deploy]
startCommand = "npm run db:deploy -w @vlue/db && npm run start -w @vlue/api"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
