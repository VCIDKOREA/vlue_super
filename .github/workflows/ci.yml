name: VLUE Superapp CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared (required by API unit tests)
        run: npm run build -w @vlue/shared

      - name: Policy & signup unit tests
        run: npm run api:test:policy && npm run api:test:signup

      - name: Build API (db + shared + api dist)
        run: npm run api:build

      - name: Build Web
        run: npm run web:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.vlue.kr' }}
