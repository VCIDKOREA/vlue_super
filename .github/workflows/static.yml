# 레거시 GitHub Pages 정적 배포
#
# www.vlue.kr 은 Railway @vlue/web 으로 서비스 중입니다.
# docs/DNS_WWW_VLUE_KR_SETUP.md 참고.
#
# main push 시 GitHub Pages 배포를 시도하면 deploy 단계 403 등으로
# "pages build and deployment" 실패 알림이 발생하므로 수동 실행만 허용합니다.

name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
