name: VLUE PC Installer Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (예: pc-v1.0.0)"
        required: true
        default: pc-v1.0.0
  push:
    tags:
      - "pc-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @vlue/shared

      - name: Build web for Electron
        run: npm run web:build:electron
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.vlue.kr' }}

      - name: Prepare electron pack
        run: node scripts/prepare-electron-pack.mjs

      - name: Build Windows installer
        run: npm run dist:win -w @vlue/electron
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify installer artifact
        shell: bash
        run: |
          test -f apps/electron/dist/VLUE-Setup-1.0.0.exe
          ls -lh apps/electron/dist/VLUE-Setup-1.0.0.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: VLUE PC Installer ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            Windows PC 설치 파일 (VLUE-Setup-1.0.0.exe)

            Railway 빌드·웹 다운로드 URL:
            `https://www.vlue.kr/downloads/VLUE-Setup-1.0.0.exe`

            소스 호스팅:
            `https://github.com/VCIDKOREA/vlue_super/releases/download/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}/VLUE-Setup-1.0.0.exe`
          files: apps/electron/dist/VLUE-Setup-1.0.0.exe
          make_latest: true
          fail_on_unmatched_files: true
