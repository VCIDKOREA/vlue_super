# www.vlue.kr Coming Soon 랜딩 — GitHub Pages
#
# 설정 A (권장·간단): Settings → Pages → Deploy from a branch → main → / (root)
#   → 루트의 index.html, favicon.svg, CNAME 이 바로 서빙됩니다.
#
# 설정 B: Settings → Pages → Source: GitHub Actions
#   → 이 워크플로가 배포합니다.

name: Deploy Coming Soon (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "CNAME"
      - ".nojekyll"
      - "web/public/coming-soon.html"
      - "web/public/favicon.svg"
      - ".github/workflows/github-pages-coming-soon.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-coming-soon
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp favicon.svg _site/favicon.svg
          cp CNAME _site/CNAME
          cp .nojekyll _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
