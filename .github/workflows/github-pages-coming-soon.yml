# www.vlue.kr Coming Soon — GitHub Pages (레거시)
#
# www.vlue.kr 은 Railway @vlue/web 으로 이전합니다.
# docs/DNS_WWW_VLUE_KR_SETUP.md 참고.
#
# 이 워크플로는 수동 실행만 허용합니다 (push 자동 배포 비활성).

name: Deploy Coming Soon (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-coming-soon
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp favicon.svg _site/favicon.svg
          cp CNAME _site/CNAME
          cp .nojekyll _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
