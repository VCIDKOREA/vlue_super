<!-- VLUE variation A: no shield � diamond pupil + dashed ring -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>VLUE diamond eye</title>
  <defs>
    <linearGradient id="vba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="36.6" fill="url(#vba)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/>
  <g transform="translate(64,64) rotate(45)">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#fff"/>
  </g>
  <circle cx="64" cy="64" r="5" fill="#1d4ed8"/>
</svg>
